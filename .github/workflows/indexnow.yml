name: IndexNow ping

# After each push to main, wait until Cloudflare Pages has published that commit, then submit the changed page URLs.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for the Cloudflare Pages deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 90); do
            read -r status conclusion <<< "$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "Cloudflare Pages")] | (last // {}) | "\(.status // "none") \(.conclusion // "none")"' || echo "unknown none")"
            echo "Cloudflare Pages: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$status" = "completed" ]; then echo "::error::Cloudflare Pages deploy ended with $conclusion; nothing sent"; exit 1; fi
            sleep 20
          done
          echo "::error::Cloudflare Pages did not finish $SHA within 30 minutes; nothing sent. Re-run this job once the site is live."
          exit 1

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs --changed ${{ github.event.before }}
